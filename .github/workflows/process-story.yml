name: Procesar nueva historia

# Se dispara cuando se crea un Issue con la etiqueta "nueva-historia".
on:
  issues:
    types: [opened, labeled]

# Permisos mínimos: escribir en el repo (commit) y gestionar issues (cerrarlo).
permissions:
  contents: write
  issues: write

jobs:
  procesar:
    # Solo procesa issues que tengan la etiqueta "nueva-historia".
    if: contains(github.event.issue.labels.*.name, 'nueva-historia')
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Procesar el Issue y actualizar stories.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node .github/scripts/process-story.js

      - name: Confirmar cambios (commit & push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stories.json images/ 2>/dev/null || git add data/stories.json
          if git diff --staged --quiet; then
            echo "No hay cambios que confirmar."
          else
            git commit -m "Nueva historia desde el Issue #${{ github.event.issue.number }}"
            git push
          fi

      - name: Comentar y cerrar el Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '¡Gracias por tu aporte! 🦡 Tu historia fue publicada en el muro. Puede tardar 1-2 minutos en aparecer mientras el sitio se actualiza.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
