name: Nueva historia
description: Comparte tu relato o ilustración del Armador de Mundos
title: "Nueva historia: "
labels: ["nueva-historia"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por expandir el universo del Armador de Mundos.
        Normalmente este formulario se rellena automáticamente desde la web,
        pero también puedes escribir tu historia directamente aquí.
  - type: input
    id: autor
    attributes:
      label: Autor
      description: Tu nombre o seudónimo
      placeholder: Ej. Sofía Ríos
    validations:
      required: true
  - type: textarea
    id: narracion
    attributes:
      label: Narración
      description: Escribe aquí tu relato.
      placeholder: Había una vez, en las galerías subterráneas...
    validations:
      required: true
  - type: textarea
    id: imagen
    attributes:
      label: Imagen
      description: Opcional. La web incrusta la imagen automáticamente. Si escribes a mano, déjalo vacío.
      placeholder: (sin imagen)
    validations:
      required: false
